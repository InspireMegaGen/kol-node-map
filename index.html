<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dental KOL node map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #1a365d;
    --blue: #2c6eab;
    --teal: #1aa6a0;
    --orange: #e8882f;
    --ink: #1c2430;
    --muted: #5c6b7a;
    --line: #c5ccd3;
    --bg: #f3f5f7;
    --card: #fff;
    --shadow: 0 10px 18px rgba(22, 34, 51, .16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: Outfit, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  button, input { font-family: inherit; }
  .app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100%; overflow: hidden; }
  aside {
    background: var(--card);
    border-right: 1px solid #e4e8ee;
    display: flex; flex-direction: column;
    min-height: 0; min-width: 0;
  }
  .brand-lockup { padding: 18px 18px 10px; }
  .brand-lockup h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.02em; }
  .brand-lockup p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .tools { padding: 10px 14px 0; }
  .search {
    width: 100%; border: 1px solid #d5dde6; border-radius: 10px;
    padding: 10px 12px; font-size: 14px; outline: none; background: #fbfcfd;
  }
  .search:focus { border-color: var(--blue); background: #fff; }
  .hits {
    margin-top: 6px; background: #fff; border: 1px solid #e4e8ee; border-radius: 10px;
    max-height: 220px; overflow: auto; display: none;
  }
  .hits.show { display: block; }
  .hit {
    width: 100%; text-align: left; border: 0; background: transparent;
    padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #f2f4f7;
  }
  .hit:hover { background: #f4f8fb; }
  .hit b { display: block; font-size: 13.5px; }
  .hit span { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; }
  .chip, .brand-btn, .mini {
    border: 1px solid #d7dee6; background: #fff; color: var(--ink);
    border-radius: 999px; padding: 6px 10px; font-size: 12.5px; cursor: pointer;
  }
  .chip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .chip.imm.on { background: #c56a12; border-color: #c56a12; }
  .chip.fa.on { background: #b85a0e; border-color: #b85a0e; }
  .chip.gbr.on { background: #0e7f7a; border-color: #0e7f7a; }
  .scroll { overflow: auto; padding: 0 10px 16px; min-height: 0; }
  .brand-btn {
    display: flex; width: 100%; justify-content: space-between; align-items: center;
    border-radius: 12px; padding: 9px 12px; margin: 0 0 6px; text-align: left;
  }
  .brand-btn.on { background: #eef4fb; border-color: #b9d0ea; }
  .brand-btn small { color: var(--muted); }
  .section-label {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 12px 6px 6px;
  }
  details.gloss { margin: 4px 4px 8px; border: 1px solid #e6ebf1; border-radius: 12px; padding: 8px 10px; background: #fbfcfd; }
  details.gloss summary { cursor: pointer; font-weight: 600; font-size: 13.5px; }
  details.gloss p, details.gloss li { font-size: 12.5px; color: #334; line-height: 1.45; }
  details.gloss ul { margin: 6px 0 0; padding-left: 16px; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 0 8px 8px; color: var(--muted); }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
  .topbar {
    height: 58px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: rgba(255,255,255,.92); border-bottom: 1px solid #e4e8ee;
  }
  .topbar h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .topbar .sub { color: var(--muted); font-size: 12.5px; }
  .spacer { flex: 1; }
  .mini { border-radius: 8px; }
  .viewport { flex: 1; overflow: hidden; position: relative; background:
    radial-gradient(circle at 50% 0, #fff, #f7f8fa 55%); cursor: grab; }
  .viewport.drag { cursor: grabbing; }
  .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  svg.wires { position: absolute; inset: 0; overflow: visible; }
  .node {
    position: absolute; border: 0; padding: 0; background: transparent; cursor: pointer;
    transform: translate(-50%, -50%);
  }
  .bubble {
    border-radius: 50%; display: grid; place-items: center; color: #fff;
    box-shadow: var(--shadow); text-align: center; line-height: 1.05;
    font-weight: 650; position: relative;
  }
  .bubble.brand { background: var(--navy); }
  .bubble.team { background: var(--blue); }
  .bubble.topic { background: var(--teal); }
  .bubble.kol {
    background: #f3f4f6; color: var(--navy); border: 4px solid var(--orange);
    overflow: hidden; box-shadow: var(--shadow);
  }
  .bubble.kol.also { border-style: dashed; }
  .bubble.kol .ini {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 16px; font-weight: 700; color: var(--navy);
  }
  .bubble.kol img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
  .bubble.kol:has(img) .ini { display: none; }
  .bubble small { display: block; font-weight: 500; font-size: 11px; opacity: .9; margin-top: 2px; }
  .node .cap {
    position: absolute; left: 50%; top: calc(100% + 6px); transform: translateX(-50%);
    width: 124px; text-align: center; font-size: 12.5px; font-weight: 650; color: var(--ink);
    line-height: 1.15;
  }
  .node .cap em { display: block; font-style: normal; font-weight: 500; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .node .cap .touch { display: block; margin-top: 3px; font-size: 10px; font-weight: 550; line-height: 1.3; color: var(--blue); overflow-wrap: anywhere; }
  .node .cap .touch a, .node .cap .touch span { display: block; color: inherit; text-decoration: none; }
  .node .cap .touch a:hover { text-decoration: underline; }
  button.hit { border: 0; padding: 0; background: transparent; cursor: pointer; display: block; }
  .touch-top { margin: 2px 0 8px; padding: 8px 10px; background: #f4f8fb; border-radius: 10px; }
  .node.dim { opacity: .28; }
  .node.on .bubble { outline: 3px solid #16324f; outline-offset: 3px; }
  .legend {
    position: absolute; left: 14px; bottom: 14px; background: rgba(255,255,255,.94);
    border: 1px solid #e4e8ee; border-radius: 12px; padding: 8px 10px; font-size: 12px;
    display: flex; gap: 12px; color: var(--muted);
  }
  .sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: -1px; }
  .drawer {
    position: absolute; top: 58px; right: 0; bottom: 0; width: min(420px, 100%);
    background: #fff; border-left: 1px solid #e4e8ee; box-shadow: -12px 0 30px rgba(0,0,0,.06);
    transform: translateX(104%); transition: transform .2s ease; overflow: auto; z-index: 3;
  }
  .drawer.open { transform: none; }
  .drawer .pad { padding: 18px 18px 28px; }
  .drawer h3 { margin: 8px 0 2px; font-size: 22px; }
  .muted { color: var(--muted); }
  .hero {
    width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
    border: 4px solid var(--orange); box-shadow: var(--shadow); background: #eef2f6;
  }
  .hero.ph {
    display: grid; place-items: center; font-size: 32px; font-weight: 700; color: var(--navy);
  }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .badge { font-size: 11.5px; border-radius: 999px; padding: 3px 8px; background: #eef3f8; color: #234; }
  .badge.imm { background: #fff1e4; color: #8a4b08; }
  .badge.fa { background: #fff4e8; color: #7a3e06; }
  .badge.gbr { background: #e5f7f6; color: #0c5c58; }
  .badge.warn { background: #fff6d8; color: #6d5608; }
  .badge.ok { background: #e7f6ec; color: #146c36; }
  .kv { font-size: 14px; line-height: 1.45; }
  .kv a { color: var(--blue); }
  .src { font-size: 12.5px; line-height: 1.4; }
  .src a { color: var(--blue); word-break: break-all; }
  .close {
    position: sticky; top: 0; float: right; border: 0; background: #f2f4f7;
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eef1f4; vertical-align: top; }
  th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .dir { position: absolute; inset: 58px 0 0 0; overflow: auto; background: #fff; padding: 16px 18px 40px; display: none; }
  .dir.show { display: block; }
  .note { font-size: 13px; color: #3c4a58; line-height: 1.45; overflow-wrap: anywhere; }
  td .note { font-size: 12.5px; }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand-lockup">
      <h1>KOL node map</h1>
      <p>Dental implant brands, their education teams, and public clinicians for immediate, full-arch, and guided bone regeneration / connective-tissue work.</p>
    </div>
    <div class="tools">
      <input id="q" class="search" placeholder="Search a name, city, or synonym (All-on-4, CTG, Pro Arch…)" autocomplete="off" />
      <div id="hits" class="hits"></div>
    </div>
    <div class="chips" id="topic-chips"></div>
    <label class="check"><input type="checkbox" id="seed-only" /> Spreadsheet names only</label>
    <div class="scroll">
      <div class="section-label">Brands</div>
      <div id="brand-list"></div>
      <button class="brand-btn" id="open-dir" type="button"><span>All companies</span><small>Directory</small></button>
      <div class="section-label">The three keys</div>
      <div id="glossary"></div>
      <div class="section-label">How this was built</div>
      <details class="gloss" open>
        <summary>Scope and corrections</summary>
        <div id="about"></div>
      </details>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <div>
        <h2 id="title">Straumann</h2>
        <div class="sub" id="subtitle"></div>
      </div>
      <div class="spacer"></div>
      <button class="mini" id="zoom-out" type="button">−</button>
      <button class="mini" id="zoom-in" type="button">+</button>
      <button class="mini" id="fit" type="button">Fit</button>
      <button class="mini" id="spread" type="button">All brands</button>
    </div>
    <div class="viewport" id="viewport">
      <div class="world" id="world"></div>
      <div class="legend">
        <span><i class="sw" style="background:#1a365d"></i>Brand</span>
        <span><i class="sw" style="background:#2c6eab"></i>Team</span>
        <span><i class="sw" style="background:#1aa6a0"></i>Topic</span>
        <span><i class="sw" style="background:#e8882f"></i>KOL</span>
        <span><i class="sw" style="background:#fff;border:2px dashed #e8882f"></i>Also this topic</span>
      </div>
    </div>
    <div class="dir" id="dir"></div>
    <aside class="drawer" id="drawer"><div class="pad" id="drawer-body"></div></aside>
  </main>
</div>
<script src="data.js"></script>
<script>
const TOPICS = [
  { id: "ALL", label: "All topics" },
  { id: "IMM", label: "IMM" },
  { id: "FA", label: "FA" },
  { id: "GBR", label: "GBR/CTG" }
];
const state = {
  brandId: "straumann",
  topic: "ALL",
  seedOnly: false,
  query: "",
  spread: false,
  directory: false,
  scale: 1, tx: 40, ty: 24,
  selected: null
};

const $ = (id) => document.getElementById(id);
const DATA = window.KOL_DATA;

function keyById(id) { return DATA.keys.find(k => k.id === id); }
function brandById(id) { return DATA.brands.find(b => b.id === id); }
function findKol(brandId, kolId) {
  const b = brandById(brandId);
  return b && b.kols.find(k => k.id === kolId);
}

function blob(k) {
  return [k.name, k.short, k.city, k.country, k.role, k.bio, k.credentials,
    ...(k.aliases || []), ...(k.topics || [])].join(" ").toLowerCase();
}

function queryTopics(q) {
  const hits = new Set();
  if (!q) return hits;
  for (const key of DATA.keys) {
    const words = [key.name, key.label, ...(key.aliases || [])].map(s => s.toLowerCase());
    if (words.some(w => w.includes(q) || q.includes(w))) hits.add(key.id);
  }
  return hits;
}

function matchScore(k, q) {
  if (!q) return 1;
  if (blob(k).includes(q)) return 2;
  const topics = queryTopics(q);
  if ([...topics].some(t => k.topics.includes(t))) return 1;
  return 0;
}

function visible(k) {
  if (state.seedOnly && k.seed !== "spreadsheet") return false;
  return true;
}

function peopleFor(brand, topic) {
  const q = state.query.trim().toLowerCase();
  const list = brand.kols.filter(k => visible(k) && k.topics.includes(topic));
  if (state.topic !== "ALL" && state.topic !== topic) return [];
  return list
    .filter(k => state.topic === topic || k.primary === topic)
    .map(k => ({ k, also: k.primary !== topic }))
    .filter(item => !q || matchScore(item.k, q) > 0 || brand.kols.some(x => matchScore(x, q) > 0));
}

function layoutBrand(brand, originX) {
  const topics = state.topic === "ALL" ? ["IMM", "FA", "GBR"] : [state.topic];
  const groups = topics.map(t => ({ t, people: peopleFor(brand, t) }));
  const colW = groups.map(g => {
    const n = Math.max(g.people.length, 1);
    const rows = n > 4 ? 2 : 1;
    const per = Math.ceil(n / rows);
    return Math.max(250, per * 136);
  });
  const gap = 36;
  const width = colW.reduce((a, b) => a + b, 0) + gap * 2;
  const height = groups.some(g => g.people.length > 4) ? 1040 : 820;
  const nodes = [];
  const edges = [];
  const cx = originX + width / 2;
  nodes.push({ id: "brand:" + brand.id, kind: "brand", brand: brand.id, x: cx, y: 78, r: 62, label: brand.short, sub: null });
  nodes.push({ id: "team:" + brand.id, kind: "team", brand: brand.id, x: cx, y: 230, r: 44, label: brand.team.short, sub: null });
  edges.push({ x1: cx, y1: 78 + 62, x2: cx, y2: 230 - 44 });
  let x = originX;
  groups.forEach((g, i) => {
    const mid = x + colW[i] / 2;
    const key = keyById(g.t);
    nodes.push({ id: "topic:" + brand.id + ":" + g.t, kind: "topic", brand: brand.id, topic: g.t, x: mid, y: 400, r: 48, label: key.label, sub: null });
    edges.push({ x1: cx, y1: 230 + 44, x2: mid, y2: 400 - 48 });
    const n = g.people.length;
    if (!n) {
      nodes.push({ id: "empty:" + brand.id + ":" + g.t, kind: "empty", x: mid, y: 560, r: 0, label: "None mapped", sub: "" });
    } else {
      const rows = n > 4 ? 2 : 1;
      const per = Math.ceil(n / rows);
      g.people.forEach((item, idx) => {
        const row = Math.floor(idx / per);
        const col = idx % per;
        const count = Math.min(per, n - row * per);
        const span = (count - 1) * 136;
        const px = mid - span / 2 + col * 136;
        const py = 600 + row * 210;
        nodes.push({
          id: "kol:" + brand.id + ":" + item.k.id,
          kind: "kol", brand: brand.id, kol: item.k.id, also: item.also,
          x: px, y: py, r: 36,
          label: item.k.short || item.k.name,
          sub: item.k.city || ""
        });
        edges.push({ x1: mid, y1: 400 + 48, x2: px, y2: py - 36, also: item.also });
      });
    }
    x += colW[i] + gap;
  });
  return { width: originX + width, height, nodes, edges, next: originX + width + 70 };
}

function shiftLayout(lay, dx, dy) {
  for (const n of lay.nodes) { n.x += dx; n.y += dy; }
  for (const e of lay.edges) { e.x1 += dx; e.y1 += dy; e.x2 += dx; e.y2 += dy; }
}

function renderMap() {
  const world = $("world");
  const brands = state.spread ? DATA.brands : [brandById(state.brandId)];
  let nodes = [], edges = [], height = 720, width = 800;
  if (!state.spread) {
    const lay = layoutBrand(brands[0], 40);
    nodes = lay.nodes;
    edges = lay.edges;
    height = lay.height;
    width = lay.next;
  } else {
    const gapX = 90, gapY = 70;
    const lays = brands.map(b => layoutBrand(b, 0));
    const view = $("viewport");
    const availW = Math.max(640, view.clientWidth - 36);
    const availH = Math.max(420, view.clientHeight - 78);
    let bestPer = lays.length, bestScale = -1;
    for (let per = 1; per <= lays.length; per++) {
      const rows = Math.ceil(lays.length / per);
      let maxRow = 0;
      for (let r = 0; r < rows; r++) {
        const slice = lays.slice(r * per, r * per + per);
        const w = slice.reduce((a, l) => a + l.width, 0) + gapX * Math.max(0, slice.length - 1);
        maxRow = Math.max(maxRow, w);
      }
      const totalH = rows * Math.max(...lays.map(l => l.height)) + gapY * (rows - 1);
      const sc = Math.min(availW / maxRow, availH / totalH);
      if (sc > bestScale) { bestScale = sc; bestPer = per; }
    }
    const rowH = Math.max(...lays.map(l => l.height));
    let maxX = 0, maxY = 0;
    for (let i = 0; i < lays.length; i++) {
      const row = Math.floor(i / bestPer);
      const col = i % bestPer;
      const rowStart = row * bestPer;
      const x = lays.slice(rowStart, rowStart + col).reduce((a, l) => a + l.width + gapX, 40);
      const y = 24 + row * (rowH + gapY);
      const lay = lays[i];
      shiftLayout(lay, x, y);
      nodes.push({ id: "caption:" + brands[i].id, kind: "caption", x: x + 8, y: y + 4, r: 0, label: brands[i].name, sub: "" });
      nodes = nodes.concat(lay.nodes);
      edges = edges.concat(lay.edges);
      maxX = Math.max(maxX, x + lay.width);
      maxY = Math.max(maxY, y + lay.height);
    }
    width = maxX + 40;
    height = maxY + 20;
  }
  const q = state.query.trim().toLowerCase();
  const anyHit = q && brands.some(b => b.kols.some(k => matchScore(k, q) > 0));
  world.style.width = width + "px";
  world.style.height = height + "px";
  const lines = edges.map(e => `<line x1="${e.x1}" y1="${e.y1}" x2="${e.x2}" y2="${e.y2}" stroke="${e.also ? "#d9c3a8" : "#c5ccd3"}" stroke-width="${e.also ? 1.2 : 1.6}" />`).join("");
  world.innerHTML = `<svg class="wires" width="${width}" height="${height}">${lines}</svg>` + nodes.map(n => nodeHtml(n, q, anyHit)).join("");
  world.querySelectorAll("button[data-id]").forEach(btn => {
    btn.addEventListener("click", (ev) => {
      ev.stopPropagation();
      openNode(btn.dataset.id);
    });
  });
  applyTransform();
}

function nodeHtml(n, q, anyHit) {
  if (n.kind === "caption") {
    return `<div class="node" style="left:${n.x}px;top:${n.y}px;transform:none;font-weight:700">${escapeHtml(n.label)}</div>`;
  }
  if (n.kind === "empty") {
    return `<div class="node" style="left:${n.x}px;top:${n.y}px"><div class="cap" style="position:static;transform:none;color:#8aa">${escapeHtml(n.label)}</div></div>`;
  }
  const selected = state.selected === n.id ? " on" : "";
  let dim = "";
  if (n.kind === "kol" && anyHit) {
    const k = findKol(n.brand, n.kol);
    if (matchScore(k, q) === 0) dim = " dim";
  }
  let inner = "";
  if (n.kind === "kol") {
    const k = findKol(n.brand, n.kol);
    const focus = k.photoFocus ? ` style="object-position:${k.photoFocus}"` : "";
    const img = k.photo ? `<img alt="" src="${k.photo}"${focus} onerror="this.remove()" />` : "";
    const initials = escapeHtml(initialsOf(k.name));
    inner = `${img}<span class="ini">${initials}</span>`;
    const place = [k.city, k.country].filter(Boolean).join(", ");
    const cap = `<div class="cap">${escapeHtml(k.short)}<em>${escapeHtml(place)}</em>${nodeTouch(k)}</div>`;
    return `<div class="node${selected}${dim}" style="left:${n.x}px;top:${n.y}px">
      <button class="hit" data-id="${n.id}" type="button"><div class="bubble kol${n.also ? " also" : ""}" style="width:${n.r*2}px;height:${n.r*2}px">${inner}</div></button>${cap}</div>`;
  }
  const lines = String(n.label).split("\n");
  inner = lines.map((l, i) => i ? `<small>${escapeHtml(l)}</small>` : escapeHtml(l)).join("");
  const size = n.kind === "brand" ? 15 : 14;
  return `<button class="node${selected}${dim}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px" type="button">
    <div class="bubble ${n.kind}" style="width:${n.r*2}px;height:${n.r*2}px;font-size:${size}px">${inner}</div></button>`;
}

function initialsOf(name) {
  const bits = name.replace(/\./g, "").split(/\s+/).filter(Boolean);
  const a = bits[0][0] || "";
  const b = bits.length > 1 ? bits[bits.length - 1][0] : "";
  return (a + b).toUpperCase();
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function applyTransform() {
  $("world").style.transform = `translate(${state.tx}px, ${state.ty}px) scale(${state.scale})`;
}

function fit() {
  const view = $("viewport");
  const world = $("world");
  const vw = view.clientWidth, vh = view.clientHeight;
  const reserve = $("drawer").classList.contains("open") ? Math.min(420, vw * 0.9) + 16 : 0;
  const ww = world.offsetWidth || 800, wh = world.offsetHeight || 700;
  const availW = Math.max(240, vw - reserve - 36);
  const s = Math.min(availW / ww, (vh - 78) / wh, 1.05);
  state.scale = Math.min(1.05, Math.max(s, 0.05));
  state.tx = Math.max(12, (availW - ww * state.scale) / 2 + 8);
  state.ty = 16;
  applyTransform();
}

function shownCount(brand) {
  const ids = new Set();
  for (const t of ["IMM", "FA", "GBR"]) {
    for (const item of peopleFor(brand, t)) ids.add(item.k.id);
  }
  return ids.size;
}

function renderChrome() {
  const b = brandById(state.brandId);
  $("title").textContent = state.spread ? "All populated brands" : b.name;
  const brandsNow = state.spread ? DATA.brands : [b];
  const total = brandsNow.reduce((a, x) => a + x.kols.length, 0);
  const shown = brandsNow.reduce((a, x) => a + shownCount(x), 0);
  const countBit = shown === total ? total + " clinicians" : shown + " of " + total + " clinicians";
  $("subtitle").textContent = state.spread
    ? countBit + " across " + DATA.brands.length + " education trees"
    : b.team.full + " · " + countBit + " on this tree";
  $("brand-list").innerHTML = DATA.brands.map(br => {
    const on = !state.spread && !state.directory && br.id === state.brandId ? " on" : "";
    return `<button class="brand-btn${on}" data-brand="${br.id}" type="button"><span>${escapeHtml(br.name)}</span><small>${br.kols.length}</small></button>`;
  }).join("");
  $("brand-list").querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
    state.brandId = btn.dataset.brand;
    state.spread = false;
    state.directory = false;
    state.selected = null;
    $("dir").classList.remove("show");
    $("drawer").classList.remove("open");
    renderChrome();
    renderMap();
    fit();
  }));
  $("topic-chips").innerHTML = TOPICS.map(t => {
    const cls = ["chip", t.id.toLowerCase(), state.topic === t.id ? "on" : ""].join(" ");
    return `<button class="${cls}" data-topic="${t.id}" type="button">${t.label}</button>`;
  }).join("");
  $("topic-chips").querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
    state.topic = btn.dataset.topic;
    renderChrome();
    renderMap();
    fit();
  }));
  $("glossary").innerHTML = DATA.keys.map(k => `
    <details class="gloss">
      <summary>${escapeHtml(k.label)} · ${escapeHtml(k.name)}</summary>
      <p>${escapeHtml(k.summary)}</p>
      <p><b>Also called</b></p>
      <ul>${k.aliases.map(a => `<li>${escapeHtml(a)}</li>`).join("")}</ul>
      <p><b>Not the same thing</b></p>
      <ul>${k.distinct.map(a => `<li>${escapeHtml(a)}</li>`).join("")}</ul>
      <p><b>Company protocols that sit in this bucket</b></p>
      <ul>${k.protocols.map(a => `<li>${escapeHtml(a)}</li>`).join("")}</ul>
    </details>`).join("");
  $("about").innerHTML = DATA.meta.notes.map(n => `<p class="note">${escapeHtml(n)}</p>`).join("");
}

function openNode(id) {
  state.selected = id;
  const [kind, brandId, extra] = id.split(":");
  $("drawer").classList.add("open");
  if (kind === "brand") showBrand(brandById(brandId));
  else if (kind === "team") showTeam(brandById(brandId));
  else if (kind === "topic") showTopic(brandById(brandId), extra);
  else if (kind === "kol") showKol(brandById(brandId), findKol(brandId, extra));
  renderMap();
  fit();
}

function showBrand(b) {
  $("drawer-body").innerHTML = `
    <button class="close" type="button" onclick="closeDrawer()">Close</button>
    <div class="badges"><span class="badge">${escapeHtml(b.group || "Independent")}</span></div>
    <h3>${escapeHtml(b.name)}</h3>
    <p class="muted">${escapeHtml(b.hq || "")}</p>
    <p class="kv">${escapeHtml(b.blurb)}</p>
    <p class="kv"><a href="${b.website}" target="_blank" rel="noopener">${escapeHtml(b.website)}</a></p>
    <p class="kv"><b>Education team:</b> ${escapeHtml(b.team.full)}</p>`;
}
function showTeam(b) {
  const t = b.team;
  const faculty = (t.faculty || []).map(f => `<li><b>${escapeHtml(f.name)}</b> — ${escapeHtml(f.note)}${f.url ? ` <a href="${f.url}" target="_blank" rel="noopener">Source</a>` : ""}</li>`).join("");
  $("drawer-body").innerHTML = `
    <button class="close" type="button" onclick="closeDrawer()">Close</button>
    <div class="badges"><span class="badge">${escapeHtml(b.name)}</span></div>
    <h3>${escapeHtml(t.full)}</h3>
    <p class="kv">${escapeHtml(t.blurb)}</p>
    ${contactBlock(t)}
    <p class="kv"><a href="${t.website}" target="_blank" rel="noopener">${escapeHtml(t.website)}</a></p>
    ${faculty ? `<h4>Named on the institute page, not forced onto a topic branch</h4><ul class="kv">${faculty}</ul>` : ""}`;
}
function showTopic(b, topic) {
  const key = keyById(topic);
  const people = b.kols.filter(k => k.topics.includes(topic));
  $("drawer-body").innerHTML = `
    <button class="close" type="button" onclick="closeDrawer()">Close</button>
    <div class="badges"><span class="badge ${topic.toLowerCase()}">${escapeHtml(key.label)}</span></div>
    <h3>${escapeHtml(key.name)}</h3>
    <p class="kv">${escapeHtml(key.summary)}</p>
    <h4>On this brand</h4>
    <ul class="kv">${people.map(k => `<li><button class="mini" type="button" data-jump="${b.id}:${k.id}">${escapeHtml(k.name)}</button> <span class="muted">${k.primary === topic ? "primary" : "also"}</span></li>`).join("") || "<li>No clinician mapped.</li>"}</ul>`;
  $("drawer-body").querySelectorAll("[data-jump]").forEach(btn => btn.addEventListener("click", () => {
    const [bid, kid] = btn.dataset.jump.split(":");
    openNode("kol:" + bid + ":" + kid);
  }));
}
function showKol(b, k) {
  const photo = k.photo
    ? `<img class="hero" alt="${escapeHtml(k.name)}" src="${k.photo}" style="${k.photoFocus ? "object-position:"+k.photoFocus : ""}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'hero ph',textContent:'${initialsOf(k.name)}'}))" />`
    : `<div class="hero ph">${escapeHtml(initialsOf(k.name))}</div>`;
  const badges = k.topics.map(t => `<span class="badge ${t.toLowerCase()}">${keyById(t).label}${k.primary===t?" · primary":""}</span>`).join("");
  const conf = k.confidence === "high" ? "ok" : "warn";
  const confLabel = { high: "Brand link checked on a public page", medium: "Read the assignment note", program: "Topic is the course theme, not a personal lecture title" }[k.confidence] || k.confidence;
  $("drawer-body").innerHTML = `
    <button class="close" type="button" onclick="closeDrawer()">Close</button>
    ${photo}
    <h3>${escapeHtml(k.name)}</h3>
    <p class="muted">${escapeHtml([k.credentials, k.city, k.country].filter(Boolean).join(" · "))}</p>
    ${drawerTouch(k)}
    <div class="badges">${badges}<span class="badge ${conf}">${escapeHtml(confLabel)}</span>${k.seed==="spreadsheet"?'<span class="badge">From your sheet</span>':""}</div>
    <p class="kv"><b>${escapeHtml(k.role || "")}</b></p>
    <p class="kv">${escapeHtml(k.bio || "")}</p>
    <p class="kv"><b>Why this branch.</b> ${escapeHtml(k.assignment || "")}</p>
    ${k.activity ? `<p class="kv"><b>Last 2 years.</b> ${escapeHtml(k.activity)}</p>` : ""}
    ${k.address ? `<h4>Address</h4><p class="kv">${escapeHtml(k.address)}</p>` : ""}
    <h4>Other public pages</h4>
    <p class="kv">${(k.links||[]).filter(l => !isSocial(l)).map(l => `<a href="${l.url}" target="_blank" rel="noopener">${escapeHtml(l.label)}</a>`).join("<br>") || "No further page saved."}</p>
    <p class="kv"><a href="https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(k.name)}" target="_blank" rel="noopener">Search PubMed for this name</a></p>
    <p class="note">${escapeHtml(k.photoNote || "No public headshot was saved. The circle shows initials. Social avatars were not scraped.")}</p>
    <h4>Sources</h4>
    <div class="src">${(k.sources||[]).map(s => `<div><a href="${s}" target="_blank" rel="noopener">${escapeHtml(s)}</a></div>`).join("")}</div>`;
}
function isSocial(link) {
  const blob = ((link && link.url) || "") + " " + ((link && link.label) || "");
  return /instagram|linkedin|facebook|youtube|tiktok|twitter|\/\/x\.com|@[a-z0-9._]{3,}/i.test(blob);
}
function followerNumber(count) {
  const m = String(count || "").trim().replace(/,/g, "").match(/^(\d+(?:\.\d+)?)([KkMm])?$/);
  if (!m) return null;
  const n = parseFloat(m[1]);
  const unit = (m[2] || "").toUpperCase();
  if (unit === "K") return n * 1000;
  if (unit === "M") return n * 1000000;
  return n;
}
function formatFollowers(n) {
  if (n >= 10000) {
    const k = Math.round(n / 100) / 10;
    return (Number.isInteger(k) ? String(k) : k.toFixed(1)) + "K";
  }
  return Math.round(n).toLocaleString("en-US");
}
function followerTotal(k) {
  const rows = k.followers || [];
  if (!rows.length) return null;
  let sum = 0;
  for (const f of rows) {
    const n = followerNumber(f.count);
    if (n == null) return null;
    sum += n;
  }
  const single = rows.length === 1 ? rows[0] : null;
  return { text: single ? single.count : formatFollowers(sum), single };
}
function nodeTouch(k) {
  const total = followerTotal(k);
  if (!total) return "";
  const text = `Followers ${total.text}`;
  const url = total.single && total.single.url;
  const inner = url
    ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(text)}</a>`
    : `<span>${escapeHtml(text)}</span>`;
  return `<span class="touch">${inner}</span>`;
}
function drawerTouch(k) {
  const rows = [];
  const list = k.followers || [];
  const used = new Set(list.map(f => f.url));
  const total = followerTotal(k);
  if (total && list.length > 1) {
    rows.push(`<div><b>Followers ${escapeHtml(total.text)} total</b></div>`);
  }
  for (const f of list) {
    const text = `${f.network} ${f.count} followers`;
    const note = f.note ? ` — ${escapeHtml(f.note)}` : "";
    rows.push(f.url
      ? `<div><a href="${escapeHtml(f.url)}" target="_blank" rel="noopener">${escapeHtml(text)}</a>${note}</div>`
      : `<div>${escapeHtml(text)}</div>`);
  }
  if (k.email) rows.push(`<div><b>Email.</b> <a href="mailto:${escapeHtml(k.email)}">${escapeHtml(k.email)}</a>${k.emailNote ? " — " + escapeHtml(k.emailNote) : ""}</div>`);
  if (k.phone) rows.push(`<div><b>Phone.</b> ${escapeHtml(k.phone)}</div>`);
  for (const link of k.links || []) {
    if (isSocial(link) && !used.has(link.url)) rows.push(`<div><a href="${escapeHtml(link.url)}" target="_blank" rel="noopener">${escapeHtml(link.label)}</a></div>`);
  }
  if (!rows.length) return "";
  return `<div class="kv touch-top">${rows.join("")}</div>`;
}
function contactBlock(obj) {
  const rows = [];
  if (obj.email) rows.push(`<div><b>Email.</b> <a href="mailto:${escapeHtml(obj.email)}">${escapeHtml(obj.email)}</a>${obj.emailNote ? " — " + escapeHtml(obj.emailNote) : ""}</div>`);
  if (obj.phone) rows.push(`<div><b>Phone.</b> ${escapeHtml(obj.phone)}</div>`);
  if (obj.address) rows.push(`<div><b>Address.</b> ${escapeHtml(obj.address)}</div>`);
  if (!rows.length) return `<p class="muted">No public email, phone, or street address was copied. Profile links are below.</p>`;
  return `<div class="kv">${rows.join("")}</div>`;
}
function closeDrawer() {
  state.selected = null;
  $("drawer").classList.remove("open");
  renderMap();
  fit();
}
window.closeDrawer = closeDrawer;

function renderHits() {
  const q = state.query.trim().toLowerCase();
  const box = $("hits");
  if (q.length < 2) { box.classList.remove("show"); box.innerHTML = ""; return; }
  const rows = [];
  for (const b of DATA.brands) {
    for (const k of b.kols) {
      const s = matchScore(k, q);
      if (s > 0) rows.push({ b, k, s });
    }
  }
  rows.sort((a, b) => b.s - a.s || a.k.name.localeCompare(b.k.name));
  box.classList.add("show");
  box.innerHTML = rows.slice(0, 12).map(r => `<button class="hit" data-b="${r.b.id}" data-k="${r.k.id}" type="button"><b>${escapeHtml(r.k.name)}</b><span>${escapeHtml(r.b.name)} · ${r.k.topics.map(t => keyById(t).label).join(", ")}</span></button>`).join("")
    || `<div class="hit"><b>No clinician match</b><span>Try a synonym from the glossary, or open All companies.</span></div>`;
  box.querySelectorAll(".hit[data-k]").forEach(btn => btn.addEventListener("click", () => {
    state.brandId = btn.dataset.b;
    state.spread = false;
    state.directory = false;
    $("dir").classList.remove("show");
    renderChrome();
    renderMap();
    fit();
    openNode("kol:" + btn.dataset.b + ":" + btn.dataset.k);
    box.classList.remove("show");
  }));
}

function renderDirectory() {
  const rows = DATA.landscape.map(c => `<tr>
    <td><b>${escapeHtml(c.name)}</b><div class="muted">${escapeHtml(c.group || "")}</div></td>
    <td>${escapeHtml(c.country || "")}</td>
    <td>${escapeHtml(c.team || "")}</td>
    <td>${c.website ? `<a href="${c.website}" target="_blank" rel="noopener">Site</a>` : ""}<div class="note">${escapeHtml(c.note || "")}</div></td>
  </tr>`).join("");
  $("dir").innerHTML = `<h2>Company directory</h2>
    <p class="note">These are major implant and regeneration companies checked while building the map. A row without a tree means a public faculty list, split by immediate / full arch / GBR, was not found in this pass. Populated trees stay in the brand list.</p>
    <table><thead><tr><th>Company</th><th>Base</th><th>Education name</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function boot() {
  renderChrome();
  renderDirectory();
  renderMap();
  requestAnimationFrame(fit);
  $("q").addEventListener("input", () => {
    state.query = $("q").value;
    renderHits();
    renderMap();
  });
  $("seed-only").addEventListener("change", () => {
    state.seedOnly = $("seed-only").checked;
    renderChrome();
    renderMap();
    fit();
  });
  $("fit").addEventListener("click", fit);
  $("zoom-in").addEventListener("click", () => { state.scale = Math.min(2.2, state.scale * 1.15); applyTransform(); });
  $("zoom-out").addEventListener("click", () => { state.scale = Math.max(0.05, state.scale / 1.15); applyTransform(); });
  $("spread").addEventListener("click", () => {
    state.spread = !state.spread;
    state.directory = false;
    $("dir").classList.remove("show");
    $("spread").textContent = state.spread ? "One brand" : "All brands";
    renderChrome();
    renderMap();
    fit();
  });
  $("open-dir").addEventListener("click", () => {
    state.directory = !state.directory;
    $("dir").classList.toggle("show", state.directory);
    if (state.directory) closeDrawer();
  });
  const view = $("viewport");
  let drag = null;
  view.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".node")) return;
    drag = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty };
    view.classList.add("drag");
    view.setPointerCapture(e.pointerId);
  });
  view.addEventListener("pointermove", (e) => {
    if (!drag) return;
    state.tx = drag.tx + e.clientX - drag.x;
    state.ty = drag.ty + e.clientY - drag.y;
    applyTransform();
  });
  view.addEventListener("pointerup", () => { drag = null; view.classList.remove("drag"); });
  view.addEventListener("wheel", (e) => {
    e.preventDefault();
    const prev = state.scale;
    const next = Math.min(2.4, Math.max(0.05, prev * (e.deltaY < 0 ? 1.08 : 0.92)));
    const rect = view.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    state.tx = mx - (mx - state.tx) * (next / prev);
    state.ty = my - (my - state.ty) * (next / prev);
    state.scale = next;
    applyTransform();
  }, { passive: false });
  window.addEventListener("resize", fit);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
}
boot();
</script>
</body>
